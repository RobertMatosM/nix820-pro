name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native build and package-check dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev shellcheck desktop-file-utils libglib2.0-bin udev
      - uses: Swatinem/rust-cache@v2
      - name: Version and tag validation
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          if [[ "$REF_TYPE" == tag ]]; then
            test "$REF_NAME" = "v$version"
            test -f "docs/releases/$REF_NAME.md"
          fi
      - run: bash scripts/check.sh
      - name: Build and test release archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/package.sh
          bash scripts/test-package.sh "dist/nix820-pro-v$VERSION-linux-x86_64.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: nix820-pro-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: nix820-pro-linux-x86_64
          path: dist
      - name: Verify main ancestry and publish checked package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          archive="dist/nix820-pro-v$VERSION-linux-x86_64.tar.gz"
          python3 tools/check-package.py "$archive"
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG_NAME" "$archive" "$archive.sha256" \
            --verify-tag --title "Nix820 Pro $VERSION" \
            --notes-file "docs/releases/$TAG_NAME.md" "${flags[@]}"
