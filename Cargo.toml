[package]
name = "keyboard-studio"
version = "0.1.0"
edition = "2024"
license = "0BSD"
description = "Independent wired-USB AK820 Pro configurator for Linux"
readme = "README.md"
publish = false

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "x11", "wayland"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

weezl = "0.1.12"

[profile.release]
lto = "thin"
strip = "symbols"
